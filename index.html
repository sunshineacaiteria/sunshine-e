<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunshine Açaíteria · Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lilac:#EBE1F5;
    --lilac-deep:#D9C7EC;
    --purple-deep:#2E1A47;
    --purple-mid:#4B2C6B;
    --yellow:#F5C63D;
    --yellow-deep:#E8A81C;
    --leaf:#4C8C3C;
    --berry:#5D2C7A;
    --paper:#FFFCF6;
    --ink:#2E1A47;
    --line: rgba(46,26,71,0.14);
  }
  html{
    background: var(--lilac-deep);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: linear-gradient(180deg, var(--lilac) 0%, var(--lilac-deep) 100%);
    background-attachment: fixed;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding: 26px 14px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:460px; }

  /* ---------- Badge header ---------- */
  .badge{
    width:180px; height:180px;
    margin: 0 auto 14px;
    position:relative;
  }
  .badge img{ width:100%; height:100%; object-fit:contain; display:block; }

  .brand-name{
    text-align:center;
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.04em;
    color:var(--purple-deep);
    margin: 0 0 24px;
    text-transform:uppercase;
  }

  .card{
    background:var(--paper);
    border-radius:24px;
    padding:22px 20px 20px;
    box-shadow: 0 20px 44px rgba(46,26,71,.22);
  }

  .cliente-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  input[type=text]{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size:14.5px;
    font-weight:700;
    padding:12px 13px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input::placeholder{ color:#a897b3; font-weight:600; }
  input:focus{ border-color: var(--yellow-deep); }

  /* ---------- Categories ---------- */
  .category{ margin-bottom:22px; }
  .category-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:14px;
    color:#fff;
    background: var(--purple-deep);
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 14px 6px;
    border-radius:999px;
    margin: 0 0 10px;
  }

  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-info{ display:flex; flex-direction:column; }
  .item-name{ font-weight:800; font-size:13.5px; color:var(--purple-deep); line-height:1.3; }
  .item-price{ font-family:'Space Mono', monospace; font-size:11.5px; color:#8a7b98; margin-top:2px; }

  .stepper{
    display:flex; align-items:center; gap:0;
    background:var(--lilac);
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
  }
  .stepper button{
    width:28px; height:28px;
    border:none;
    background:transparent;
    color:var(--purple-deep);
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    line-height:1;
  }
  .stepper button:active{ background:var(--yellow); }
  .stepper .qty{
    width:24px;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:13px;
  }

  /* ---------- Payment ---------- */
  .pay-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pay-chip{ position:relative; }
  .pay-chip input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .pay-chip label{
    display:flex; align-items:center; justify-content:center;
    padding:11px 10px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-weight:800;
    font-size:13px;
    color:var(--purple-mid);
    transition: all .15s;
  }
  .pay-chip input:checked + label{
    background: var(--lilac);
    border-color: var(--purple-mid);
    color:var(--purple-deep);
  }
  .pay-chip input:focus-visible + label{ outline:2px solid var(--berry); outline-offset:2px; }

  /* ---------- Receipt ---------- */
  .receipt{
    border-top: 1.5px dashed var(--line);
    margin-top:22px; padding-top:14px;
    font-family:'Space Mono', monospace;
  }
  .receipt-empty{ font-size:12px; color:#a897b3; text-align:center; padding:6px 0; }
  .receipt-line{
    display:flex; justify-content:space-between;
    font-size:12px; color:#6d5c7a; margin-bottom:4px;
  }
  .receipt-total{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:10px; border-top:1px solid var(--line); padding-top:10px;
  }
  .receipt-total .label{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--purple-deep); }
  .receipt-total .value{ font-size:24px; font-weight:700; color:var(--berry); }

  button.submit{
    width:100%;
    margin-top:16px;
    padding:15px;
    border:none;
    border-radius:14px;
    background: var(--purple-deep);
    color:#fff;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition: transform .1s ease;
  }
  button.submit:active{ transform: scale(.98); }
  button.submit:disabled{ opacity:.6; cursor:default; }

  .status{
    text-align:center;
    font-size:13px;
    font-weight:800;
    margin-top:10px;
    min-height:16px;
    color:var(--leaf);
  }
  .status.err{ color:var(--berry); }

  .footer-note{
    text-align:center; color:#7c6a8a; font-size:10.5px; margin-top:16px; line-height:1.5;
  }
</style>
</head>

  <p class="brand-name">Fazer Pedido</p>

  <form class="card" id="pedidoForm">

    <div class="cliente-row">
      <input type="text" id="obs" placeholder="Observação (opcional)">
    </div>

    <div id="categorias"></div>

    <div class="category">
      <p class="category-title">💳 Pagamento</p>
      <div class="pay-grid" id="pagamento">
        <div class="pay-chip"><input type="radio" name="pagamento" id="p-credito" value="Crédito" checked><label for="p-credito">Crédito</label></div>
        <div class="pay-chip"><input type="radio" name="pagamento" id="p-debito" value="Débito"><label for="p-debito">Débito</label></div>
        <div class="pay-chip"><input type="radio" name="pagamento" id="p-dinheiro" value="Dinheiro"><label for="p-dinheiro">Dinheiro</label></div>
        <div class="pay-chip"><input type="radio" name="pagamento" id="p-pix" value="Pix"><label for="p-pix">Pix</label></div>
      </div>
    </div>

    <div class="receipt" id="receipt">
      <p class="receipt-empty" id="receipt-empty">Nenhum item selecionado</p>
      <div id="receipt-lines"></div>
      <div class="receipt-total">
        <span class="label">Total</span>
        <span class="value" id="valor-total">R$0,00</span>
      </div>
    </div>

    <button type="submit" class="submit" id="btnSubmit">Enviar pedido</button>
    <p class="status" id="status"></p>
  </form>

  <p class="footer-note">Pedidos registrados automaticamente na planilha da loja.</p>
</div>

<script>
  // ====== COLE AQUI A URL DO SEU APPS SCRIPT (veja instruções fora do card) ======
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYqpAgqa1Qfx92eSfL3APIV4BP3NjSVa3xF9GhDG6x3u7g5_b6IFO4-HmFJBKsdBk0/exec";
  // =================================================================================

 const MENU = [
    { categoria: "Açaí", itens: [
      { nome: "Açaí Maracujá 300ml", preco: 17 },
      { nome: "Açaí Maracujá 500ml", preco: 20 },
      { nome: "Açaí Ninho 300ml", preco: 17 },
      { nome: "Açaí Ninho 500ml", preco: 20 },
      { nome: "Açaí Paçoca 300ml", preco: 15 },
      { nome: "Açaí Paçoca 500ml", preco: 18 },
      { nome: "Açaí Nutella 300ml", preco: 20 },
      { nome: "Açaí Nutella 500ml", preco: 25 },
      { nome: "Açaí Ovomaltine 300ml", preco: 20 },
      { nome: "Açaí Ovomaltine 500ml", preco: 22 },
      { nome: "Açaí Maracujá C/Nutella 300ml", preco: 20 },
      { nome: "Açaí Maracujá C/Nutella 500ml", preco: 23 },
    ]},
    { categoria: "Guaraná", itens: [
      { nome: "Pó de Guaraná 300ml", preco: 15 },
      { nome: "Pó de Guaraná 500ml", preco: 20 },
    ]},
    { categoria: "Cuscuz", itens: [
      { nome: "Cuscuz calabresa c/ queijo e bacon", preco: 18 },
      { nome: "Cuscuz calabresa c/ queijo", preco: 15 },
      { nome: "Cuscuz carne seca c/ queijo", preco: 20 },
    ]},
    { categoria: "Caldos", itens: [
      { nome: "Caldo verde", preco: 20 },
      { nome: "Caldo de kenga", preco: 18 },
      { nome: "Caldo de carne seca c/ mandioca", preco: 25 },
    ]},
    { categoria: "Refrigerantes", itens: [
      { nome: "Coquinha", preco: 4 },
      { nome: "Fantinha", preco: 4 },
      { nome: "Fanta laranja lata", preco: 6 },
      { nome: "Fanta uva lata", preco: 6 },
      { nome: "Guaraná lata", preco: 6 },
      { nome: "Coca lata", preco: 7 },
      { nome: "Suco kapo", preco: 5 },
    ]},
  ];

  const ICONS = { "Açaí":"🫐","Guaraná":"🧋", "Cuscuz":"🌽", "Caldos":"🍲", "Refrigerantes":"🥤" };
  const state = {}; // nome -> qty

  function fmt(v){ return `R$${v.toFixed(2).replace('.',',')}`; }

  function buildMenu(){
    const root = document.getElementById('categorias');
    MENU.forEach(cat => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category';

      const title = document.createElement('p');
      title.className = 'category-title';
      title.textContent = `${ICONS[cat.categoria] || ''} ${cat.categoria}`;
      catDiv.appendChild(title);

      cat.itens.forEach(item => {
        state[item.nome] = 0;
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.nome}</span>
            <span class="item-price">${fmt(item.preco)}</span>
          </div>
          <div class="stepper">
            <button type="button" data-action="dec" data-item="${item.nome}">−</button>
            <span class="qty" id="qty-${cssId(item.nome)}">0</span>
            <button type="button" data-action="inc" data-item="${item.nome}">+</button>
          </div>
        `;
        catDiv.appendChild(row);
      });
      root.appendChild(catDiv);
    });
  }

  function cssId(nome){ return nome.replace(/[^a-zA-Z0-9]/g,'_'); }

  function priceOf(nome){
    for(const cat of MENU){
      const found = cat.itens.find(i => i.nome === nome);
      if(found) return found.preco;
    }
    return 0;
  }

  function updateReceipt(){
    const lines = document.getElementById('receipt-lines');
    const empty = document.getElementById('receipt-empty');
    lines.innerHTML = '';
    let total = 0;
    let any = false;

    Object.keys(state).forEach(nome => {
      const qty = state[nome];
      if(qty > 0){
        any = true;
        const preco = priceOf(nome);
        const subtotal = preco * qty;
        total += subtotal;
        const line = document.createElement('div');
        line.className = 'receipt-line';
        line.innerHTML = `<span>${qty}x ${nome}</span><span>${fmt(subtotal)}</span>`;
        lines.appendChild(line);
      }
    });

    empty.style.display = any ? 'none' : 'block';
    document.getElementById('valor-total').textContent = fmt(total);
    return total;
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const nome = btn.dataset.item;
    const action = btn.dataset.action;
    if(action === 'inc') state[nome] = (state[nome] || 0) + 1;
    if(action === 'dec') state[nome] = Math.max(0, (state[nome] || 0) - 1);
    document.getElementById(`qty-${cssId(nome)}`).textContent = state[nome];
    updateReceipt();
  });

  buildMenu();
  updateReceipt();

  const form = document.getElementById('pedidoForm');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btnSubmit');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status';

    if(GOOGLE_SCRIPT_URL.includes('COLE_AQUI')){
      statusEl.textContent = 'Configure a URL do Google Sheets no código antes de usar.';
      statusEl.className = 'status err';
      return;
    }

    const obs = document.getElementById('obs').value.trim();

    const itensSelecionados = Object.keys(state).filter(k => state[k] > 0);
    if(itensSelecionados.length === 0){
      statusEl.textContent = 'Selecione ao menos um item.';
      statusEl.className = 'status err';
      return;
    }

    const pedidoTexto = itensSelecionados.map(n => `${state[n]}x ${n}`).join(' | ');
    const pagamento = document.querySelector('input[name=pagamento]:checked').value;
    const total = updateReceipt();

    const agora = new Date();
    const pad = n => String(n).padStart(2,'0');
    const pedidoId = `${pad(agora.getDate())}${pad(agora.getMonth()+1)}${String(agora.getFullYear()).slice(-2)}-${pad(agora.getHours())}${pad(agora.getMinutes())}${pad(agora.getSeconds())}`;

    const dados = {
      pedido: pedidoId,
      data: agora.toLocaleString('pt-BR'),
      observacao: obs,
      pagamento: pagamento,
      itens: itensSelecionados.map(n => ({
        produto: n,
        quantidade: state[n],
        valorUnitario: priceOf(n).toFixed(2).replace('.',','),
        valorTotal: (priceOf(n) * state[n]).toFixed(2).replace('.',',')
      }))
    };

    // Mostra a confirmação e limpa o formulário imediatamente,
    // sem esperar a planilha responder.
    statusEl.textContent = 'Pedido enviado! ✅';
    statusEl.className = 'status';
    form.reset();
    Object.keys(state).forEach(k => {
      state[k] = 0;
      document.getElementById(`qty-${cssId(k)}`).textContent = 0;
    });
    document.getElementById('p-credito').checked = true;
    updateReceipt();

    // Envia para a planilha em segundo plano (fire and forget).
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(dados)
    }).catch(err => {
      console.error('Falha ao registrar o pedido na planilha:', err);
    });
  });
</script>
</body>
</html>
